[workspace]
resolver = "2"
members = [
    "apps/dragonforge-test-lab",
    "crates/df-test-protocol",
    "crates/df-test-policy",
    "crates/df-test-agent",
    "crates/df-test-controller",
    "crates/df-test-executor",
    "crates/df-test-github",
    "crates/df-test-sandbox",
    "crates/df-test-vm",
    "crates/df-test-windows",
    "crates/df-test-gui",
    "crates/df-test-distributed",
    "crates/df-test-mcp",
    "crates/df-test-intelligence",
    "crates/df-test-intelligence-integration",
    "crates/df-test-identity",
    "crates/df-test-worker-service",
    "crates/df-test-observability",
    "crates/df-test-lifecycle",
    "crates/df-test-plans",
    "crates/df-test-dashboard",
    "crates/df-test-arm",
    "crates/df-test-install",
    "crates/df-test-release",
    "crates/df-test-security-review",
    "crates/df-test-chaos",
    "crates/df-test-dogfood",
]

[workspace.package]
version = "0.26.0"
edition = "2021"
license = "LicenseRef-DragonForge-Proprietary"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http-body-util = "0.1"
proptest = "1.6"
rand = "0.8"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlite = "0.36"
subtle = "2.6"
tempfile = "3.13"
thiserror = "2.0"
tokio = { version = "1.41", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tower-http = { version = "0.6", features = ["set-header", "trace"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
webpki-roots = "0.26"
x509-parser = "0.16"
