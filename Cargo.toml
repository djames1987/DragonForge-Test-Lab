[workspace]
resolver = "2"
members = [
    "apps/dragonforge-test-lab",
    "crates/df-test-protocol",
    "crates/df-test-policy",
    "crates/df-test-agent",
    "crates/df-test-controller",
    "crates/df-test-dashboard",
    "crates/df-test-executor",
    "crates/df-test-github",
    "crates/df-test-sandbox",
    "crates/df-test-vm",
    "crates/df-test-windows",
    "crates/df-test-gui",
    "crates/df-test-distributed",
    "crates/df-test-mcp",
    "crates/df-test-intelligence",
    "crates/df-test-intelligence-integration",
    "crates/df-test-identity",
    "crates/df-test-worker-service",
    "crates/df-test-observability",
    "crates/df-test-lifecycle",
    "crates/df-test-plans",
    "crates/df-test-arm",
    "crates/df-test-install",
    "crates/df-test-release",
    "crates/df-test-security-review",
    "crates/df-test-chaos",
]

[workspace.package]
version = "0.25.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
proptest = "=1.5.0"
criterion = "0.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = "0.23"
rcgen = "0.14"
