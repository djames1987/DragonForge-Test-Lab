name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Do not include credentials, tokens, private keys, proprietary repository contents, personal data, or security exploit details. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: commit SHA or release/version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and relevant runtime/tool versions; omit machine-unique or sensitive identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic/non-sensitive data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
