name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Linux worker doctor
        run: cargo run -p dragonforge-test-lab -- linux-doctor
      - name: Linux containment service and mTLS fixture
        run: cargo run -p dragonforge-test-lab -- linux-fixture
      - name: Build Linux sandbox image
        run: bash ./scripts/build-sandbox-image.sh docker
      - name: Docker sandbox doctor
        run: cargo run -p dragonforge-test-lab -- sandbox-doctor --sandbox docker
