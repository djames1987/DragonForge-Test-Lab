schema_version = 1

[project]
name = "DragonForge Test Lab"

[profiles.fast]
actions = ["cargo_fmt_check", "cargo_clippy", "cargo_test"]
timeout_seconds = 900

[worker.local]
workspace_root = ".dragonforge-test-lab/workspaces"
artifact_root = ".dragonforge-test-lab/artifacts"
output_limit_bytes = 2097152
retain_workspace = false

[sandbox]
mode = "native"
container_image = "dragonforge/test-lab-rust:0.4.0"
# Set this to a dedicated local account name on production workers.
required_worker_user = ""

[security]
allow_arbitrary_shell = false
require_https_repositories = true
require_process_tree_containment = true
